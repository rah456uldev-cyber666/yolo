# Builds the Medibot Android app (APK) in the cloud, for free, on every push.
# Download it from: GitHub repo > Actions > latest "Build Android APK" run > Artifacts > medibot-apk
name: Build Android APK

on:
  push:
    branches: [main, master]
    paths: ["mobile/**", ".github/workflows/build-android-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # (No setup-android step: GitHub's ubuntu runner already has the Android SDK.)

      - name: Put your keys into the app (optional)
        # Add these in GitHub repo > Settings > Secrets and variables > Actions > New repository secret.
        #   FIREBASE_API_KEY = Firebase > Project settings > General > Web API key   (accounts + email verification)
        #   GROQ_API_KEY     = optional, online AI answers
        #   FAST2SMS_API_KEY = optional, real SMS codes (paid per SMS). Anyone who unpacks the APK can read it,
        #                      so only build it in for your own demo phones. Otherwise type it in the app's Settings.
        # Any secret you leave out stays empty, and users can still type keys in the app's Settings.
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FAST2SMS_API_KEY: ${{ secrets.FAST2SMS_API_KEY }}
        run: |
          node -e '
            const e = Object.fromEntries(Object.entries(process.env).map(([k, v]) => [k, String(v || "").trim()]));
            const c = {
              firebaseApiKey: e.FIREBASE_API_KEY || "",
              groqApiKey: e.GROQ_API_KEY || "", groqModel: "",
              fast2smsApiKey: e.FAST2SMS_API_KEY || "", fast2smsRoute: "q",
              ollamaUrl: "", ollamaModel: "llama3.2:3b", defaultCountryCode: "+91"
            };
            require("fs").writeFileSync("www/config.js", "window.MB_CONFIG = " + JSON.stringify(c, null, 2) + ";\n");
            console.log("Firebase key built in:", c.firebaseApiKey ? "yes" : "NO (app runs in demo mode)");
          '

      - name: Install Capacitor
        run: npm ci

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Medibot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: medibot-apk
          path: mobile/Medibot.apk
