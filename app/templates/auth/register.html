{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>Create your account</h1>
  <p class="muted">We'll send a one-time code to your mobile number to verify it.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Full name
      <input name="full_name" value="{{ form.full_name }}" required maxlength="80" autocomplete="name">
    </label>
    <label>Mobile number
      <input name="phone" value="{{ form.phone }}" required inputmode="tel" autocomplete="tel"
             placeholder="9876543210 or +919876543210">
    </label>
    <label>Password
      <input type="password" name="password" required minlength="8" autocomplete="new-password">
      <small class="muted">At least 8 characters, with a letter and a number.</small>
    </label>
    <label>Confirm password
      <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
    </label>
    <button type="submit" class="primary">Send OTP</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
