{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>Reset your password</h1>
  <p class="muted">Enter your registered mobile number and we'll send you a code.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Mobile number
      <input name="phone" required inputmode="tel" autocomplete="tel">
    </label>
    <button type="submit" class="primary">Send reset code</button>
  </form>
  <p class="muted"><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
</div>
{% endblock %}
